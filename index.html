<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FACET // Facial Geometry Engine</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📐</text></svg>">
  
  <!-- Technical & Mathematical Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0a0d12;
      --panel-bg: #121721;
      --panel-border: #1e2838;
      --accent-cyan: #00f0ff;
      --accent-blue: #0077ff;
      --text-main: #e2e8f0;
      --text-muted: #64748b;
      --success: #10b981;
      --warning: #f59e0b;
      --font-mono: 'Fira Code', monospace;
      --font-sans: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--panel-bg);
      border-bottom: 1px solid var(--panel-border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: 2px;
      color: var(--accent-cyan);
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 420px;
      gap: 1.5rem;
      padding: 1.5rem;
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
    }

    .viewport-panel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .canvas-container {
      flex: 1;
      position: relative;
      background: #05070a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 600px;
      cursor: crosshair;
    }

    canvas, img {
      max-width: 100%;
      max-height: 70vh;
      object-fit: contain;
    }

    #overlayCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .control-panel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      overflow-y: auto;
      max-height: 85vh;
    }

    .panel-title {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent-cyan);
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 0.5rem;
    }

    .active-point-banner {
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid var(--accent-cyan);
      padding: 0.85rem;
      border-radius: 4px;
      font-family: var(--font-mono);
    }
    .point-name { color: var(--accent-cyan); font-weight: 700; font-size: 1rem; }
    .point-desc { color: var(--text-muted); font-size: 0.8rem; margin-top: 0.25rem; }

    .btn-group { display: flex; gap: 0.75rem; }
    .btn {
      flex: 1;
      background: var(--panel-border);
      color: var(--text-main);
      border: 1px solid transparent;
      padding: 0.75rem 1rem;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
      text-align: center;
    }
    .btn-primary {
      background: rgba(0, 240, 255, 0.15);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }
    .btn-primary:hover {
      background: rgba(0, 240, 255, 0.25);
    }

    .point-selector-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
    }
    .point-btn {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--panel-border);
      color: var(--text-muted);
      padding: 0.5rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      border-radius: 4px;
      cursor: pointer;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .point-btn.active {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      background: rgba(0, 240, 255, 0.05);
    }
    .point-btn.placed {
      border-color: var(--success);
      color: var(--success);
    }

    .metric-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--panel-border);
      padding: 0.85rem;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .metric-name { font-size: 0.85rem; font-weight: 500; }
    .metric-val { font-family: var(--font-mono); color: var(--accent-cyan); font-weight: 600; }
  </style>
</head>
<body>

  <header>
    <div class="brand">FACET // POINT_ALIGNMENT_ENGINE</div>
  </header>

  <main>
    <div class="viewport-panel">
      <div class="canvas-container" id="canvasContainer">
        <img id="faceImage" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=1000&q=80" crossorigin="anonymous" alt="Target Subject">
        <canvas id="overlayCanvas"></canvas>
      </div>
    </div>

    <div class="control-panel">
      <div class="panel-title">ACTIVE_TARGET_LANDMARK</div>
      <div class="active-point-banner">
        <div class="point-name" id="activePointTitle">Trichion (Tr)</div>
        <div class="point-desc" id="activePointInstruction">Click on image to position hairline boundary apex.</div>
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" onclick="confirmAndNext()">CONFIRM & NEXT</button>
        <button class="btn" onclick="document.getElementById('fileInput').click()">UPLOAD</button>
      </div>
      <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="handleFileUpload(event)">

      <div class="panel-title">LANDMARK_QUEUE</div>
      <div class="point-selector-grid" id="pointGrid"></div>

      <div class="panel-title">CALCULATED_METRICS</div>
      <div id="metricContainer"></div>
    </div>
  </main>

  <script>
    const ANATOMICAL_POINTS = [
      { id: 'hairline', label: 'Trichion (Tr)', desc: 'Frontal hairline midpoint at skull apex.' },
      { id: 'glabella', label: 'Glabella (G)', desc: 'Most prominent point between eyebrows.' },
      { id: 'nasion', label: 'Nasion (N)', desc: 'Deepest point of nasal bridge depression.' },
      { id: 'pronasale', label: 'Pronasale (Prn)', desc: 'Most anterior apex point of nasal tip.' },
      { id: 'subnasale', label: 'Subnasale (Sn)', desc: 'Junction of nasal septum and upper lip.' },
      { id: 'stomion', label: 'Stomion (Sto)', desc: 'Midpoint of labial fissure (lip junction).' },
      { id: 'chin', label: 'Menton (Me)', desc: 'Lowest inferior point on soft tissue chin.' },
      { id: 'lCheek', label: 'L Zygion (Zy_L)', desc: 'Outermost lateral edge of left cheekbone.' },
      { id: 'rCheek', label: 'R Zygion (Zy_R)', desc: 'Outermost lateral edge of right cheekbone.' },
      { id: 'lGonion', label: 'L Gonion (Go_L)', desc: 'Outermost angle point of left jaw apex.' },
      { id: 'rGonion', label: 'R Gonion (Go_R)', desc: 'Outermost angle point of right jaw apex.' },
      { id: 'lInnerEye', label: 'L Medial Canthus', desc: 'Inner corner junction of left eye.' },
      { id: 'rInnerEye', label: 'R Medial Canthus', desc: 'Inner corner junction of right eye.' },
      { id: 'lOuterEye', label: 'L Lateral Canthus', desc: 'Outer corner junction of left eye.' },
      { id: 'rOuterEye', label: 'R Lateral Canthus', desc: 'Outer corner junction of right eye.' }
    ];

    let currentPointIndex = 0;
    let placedPoints = {};

    const imgElement = document.getElementById('faceImage');
    const canvas = document.getElementById('overlayCanvas');
    const ctx = canvas.getContext('2d');

    function init() {
      renderPointGrid();
      updateActivePointDisplay();
      initCanvas();
    }

    function initCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
      drawOverlays();
    }

    function renderPointGrid() {
      const grid = document.getElementById('pointGrid');
      grid.innerHTML = '';
      ANATOMICAL_POINTS.forEach((pt, index) => {
        const isPlaced = placedPoints[pt.id] !== undefined;
        const isActive = index === currentPointIndex;
        grid.innerHTML += `
          <button class="point-btn ${isActive ? 'active' : ''} ${isPlaced ? 'placed' : ''}" onclick="selectPoint(${index})">
            <span>${pt.label}</span>
            <span>${isPlaced ? '✓' : ''}</span>
          </button>
        `;
      });
    }

    function updateActivePointDisplay() {
      const pt = ANATOMICAL_POINTS[currentPointIndex];
      document.getElementById('activePointTitle').innerText = pt.label;
      document.getElementById('activePointInstruction').innerText = pt.desc;
      renderPointGrid();
    }

    function selectPoint(index) {
      currentPointIndex = index;
      updateActivePointDisplay();
      drawOverlays();
    }

    function confirmAndNext() {
      if (currentPointIndex < ANATOMICAL_POINTS.length - 1) {
        currentPointIndex++;
        updateActivePointDisplay();
        drawOverlays();
      }
    }

    function drawOverlays() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const rect = imgElement.getBoundingClientRect();
      const containerRect = canvas.parentElement.getBoundingClientRect();
      const offsetX = rect.left - containerRect.left;
      const offsetY = rect.top - containerRect.top;

      // Draw all placed points
      Object.keys(placedPoints).forEach(id => {
        const pt = placedPoints[id];
        const px = offsetX + pt.x * rect.width;
        const py = offsetY + pt.y * rect.height;

        ctx.fillStyle = id === ANATOMICAL_POINTS[currentPointIndex].id ? '#00f0ff' : '#10b981';
        ctx.beginPath();
        ctx.arc(px, py, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(px, py, 7, 0, Math.PI * 2);
        ctx.stroke();
      });

      calculateAndRenderMetrics();
    }

    canvas.addEventListener('click', (e) => {
      const rect = imgElement.getBoundingClientRect();
      const containerRect = canvas.parentElement.getBoundingClientRect();
      const offsetX = rect.left - containerRect.left;
      const offsetY = rect.top - containerRect.top;

      const normX = (e.clientX - containerRect.left - offsetX) / rect.width;
      const normY = (e.clientY - containerRect.top - offsetY) / rect.height;

      if (normX >= 0 && normX <= 1 && normY >= 0 && normY <= 1) {
        const activePt = ANATOMICAL_POINTS[currentPointIndex];
        placedPoints[activePt.id] = { x: normX, y: normY };
        drawOverlays();
        renderPointGrid();
      }
    });

    function calculateAndRenderMetrics() {
      const container = document.getElementById('metricContainer');
      container.innerHTML = '';
      const dist = (p1, p2) => p1 && p2 ? Math.hypot(p1.x - p2.x, p1.y - p2.y) : null;

      const fwhr = dist(placedPoints.lCheek, placedPoints.rCheek) && dist(placedPoints.nasion, placedPoints.stomion)
        ? (dist(placedPoints.lCheek, placedPoints.rCheek) / dist(placedPoints.nasion, placedPoints.stomion)).toFixed(2)
        : '--';

      const bigonial = dist(placedPoints.lGonion, placedPoints.rGonion) && dist(placedPoints.lCheek, placedPoints.rCheek)
        ? ((dist(placedPoints.lGonion, placedPoints.rGonion) / dist(placedPoints.lCheek, placedPoints.rCheek)) * 100).toFixed(1)
        : '--';

      container.innerHTML = `
        <div class="metric-card">
          <div>
            <div class="metric-name">Upper FWHR</div>
            <div style="font-size:0.7rem; color:var(--text-muted);">Target: 1.90 - 2.00 ratio</div>
          </div>
          <div class="metric-val">${fwhr}</div>
        </div>
        <div class="metric-card">
          <div>
            <div class="metric-name">Bigonial / Bizygomatic</div>
            <div style="font-size:0.7rem; color:var(--text-muted);">Target: 86.0 - 90.0 %</div>
          </div>
          <div class="metric-val">${bigonial} ${bigonial !== '--' ? '%' : ''}</div>
        </div>
      `;
    }

    function handleFileUpload(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          imgElement.src = event.target.result;
          placedPoints = {};
          currentPointIndex = 0;
          updateActivePointDisplay();
        };
        reader.readAsDataURL(file);
      }
    }

    window.addEventListener('resize', initCanvas);
    imgElement.onload = init;
  </script>
</body>
</html>
